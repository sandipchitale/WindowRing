name: WindowRing
options:
  bundleIdPrefix: com.sandipchitale
  deploymentTarget:
    macOS: "26.0"
configs:
  Debug: debug
  Release: release
targets:
  WindowRing:
    type: application
    platform: macOS
    sources:
      - path: WindowRing/Sources
    info:
      path: WindowRing/Generated/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: "Window Ring"
        NSAccessibilityUsageDescription: >-
          Window Ring needs Accessibility access to read your open windows'
          titles, detect the global shortcut you hold down, and bring the
          window you point at to the front. It never records, logs, or
          transmits keystrokes or window content.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sandipchitale.WindowRing
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "26.0"
